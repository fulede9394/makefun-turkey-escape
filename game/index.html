<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Trot — The Great Thanksgiving Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Turkey Trot: steer the turkey with arrow keys or WASD, dash with Space or a mouse click, dodge the farmer, the oven and the carving knives, and reach the gate"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
